services:
  - type: web
    name: thumbnail-forensics-mcp-free
    runtime: python
    plan: free
    region: singapore
    branch: deploy/thumbnail-forensics-render-free
    buildCommand: pip install -r render/requirements.txt
    startCommand: cd render && uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: THUMBNAIL_TOKEN
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.11
